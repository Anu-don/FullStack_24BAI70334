# Server
server.port=8080

# H2 in-memory database (zero setup required)
spring.datasource.url=jdbc:h2:mem:productdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (view DB in browser at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Return proper 400s instead of 500s when JSON body is missing/malformed
spring.mvc.problemdetails.enabled=true

# ---------------------------------------------------------------------
# Structured logging with correlation ID (see CorrelationIdFilter)
# Every log line is tagged with the request's correlation ID so a
# single request can be traced end-to-end across all layers.
# ---------------------------------------------------------------------
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [correlationId=%X{correlationId}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [correlationId=%X{correlationId}] %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.level.root=INFO
logging.level.com.example.restapi=DEBUG

